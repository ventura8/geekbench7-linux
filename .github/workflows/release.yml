name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build but do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: ver
        run: |
          version="$(python3 scripts/read-version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            test "$tag" = "$version"
          fi
          head -n1 debian/changelog | grep -F "$version"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 (native)
          - format: deb
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - format: rpm-fedora
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - format: rpm-opensuse
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - format: arch
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - format: appimage
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - format: flatpak
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - format: snap
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - format: tarball
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          # arm64 (native ARM runners)
          - format: deb
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - format: rpm-fedora
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - format: rpm-opensuse
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - format: arch
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - format: appimage
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - format: flatpak
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - format: snap
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - format: tarball
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          # riscv64 (QEMU on amd64 — no hosted riscv runners yet)
          - format: deb
            runner: ubuntu-24.04
            platform: linux/riscv64
            arch: riscv64
            qemu: true
          - format: rpm-fedora
            runner: ubuntu-24.04
            platform: linux/riscv64
            arch: riscv64
            qemu: true
          - format: rpm-opensuse
            runner: ubuntu-24.04
            platform: linux/riscv64
            arch: riscv64
            qemu: true
          - format: tarball
            runner: ubuntu-24.04
            platform: linux/riscv64
            arch: riscv64
            qemu: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up QEMU (riscv64 / cross)
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - name: Set up Docker Buildx
        if: matrix.qemu
        uses: docker/setup-buildx-action@v3
      - name: Packaging cell ${{ matrix.format }} (${{ matrix.arch }})
        env:
          GB_DOCKER_PLATFORM: ${{ matrix.platform }}
          GB_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: ./scripts/ci-packaging-cell.sh "${{ matrix.format }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.format }}-${{ matrix.arch }}
          path: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg.tar.zst
            artifacts/*.snap
            artifacts/*.AppImage
            artifacts/*.AppImage.zsync
            artifacts/*.flatpak
            artifacts/*.tar.gz
            artifacts/PKGBUILD
            artifacts/install.sh
            artifacts/uninstall.sh
          if-no-files-found: error

  github-release:
    needs: [verify, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true
      - name: Add installer scripts
        run: |
          cp -n install.sh uninstall.sh release-artifacts/ 2>/dev/null || true
          ls -la release-artifacts/
      - name: SHA256SUMS
        run: |
          cd release-artifacts
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' | sort | xargs sha256sum -- > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.verify.outputs.version }}
          tag_name: v${{ needs.verify.outputs.version }}
          body_path: docs/releases/v${{ needs.verify.outputs.version }}_github_description.md
          files: release-artifacts/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
