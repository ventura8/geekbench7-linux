name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build but do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: ver
        run: |
          version="$(python3 scripts/read-version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            test "$tag" = "$version"
          fi
          head -n1 debian/changelog | grep -F "$version"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- amd64 (native) ---
          - { format: deb, runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { format: rpm-fedora, runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { format: rpm-opensuse, runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { format: arch, runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { format: appimage, runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { format: flatpak, runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { format: snap, runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { format: tarball, runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          # --- arm64 (native ARM runners) ---
          - { format: deb, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
          - { format: rpm-fedora, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
          - { format: rpm-opensuse, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
          - { format: appimage, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
          - { format: flatpak, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
          - { format: snap, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
          - { format: tarball, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
          # --- riscv64: deb/tarball via QEMU; RPMs cross-targeted on amd64 (no riscv Fedora/Leap images) ---
          - { format: deb, runner: ubuntu-24.04, platform: linux/riscv64, arch: riscv64, qemu: true }
          - { format: tarball, runner: ubuntu-24.04, platform: linux/riscv64, arch: riscv64, qemu: true }
          - { format: rpm-fedora, runner: ubuntu-24.04, platform: linux/amd64, arch: riscv64, rpm_target: riscv64 }
          - { format: rpm-opensuse, runner: ubuntu-24.04, platform: linux/amd64, arch: riscv64, rpm_target: riscv64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up QEMU (riscv64)
        if: matrix.qemu
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: riscv64
      - name: Set up Docker Buildx
        if: matrix.qemu
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Packaging cell ${{ matrix.format }} (${{ matrix.arch }})
        id: pkg
        continue-on-error: ${{ matrix.format == 'snap' }}
        env:
          GB_DOCKER_PLATFORM: ${{ matrix.platform }}
          GB_RPM_TARGET: ${{ matrix.rpm_target || '' }}
          GB_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: ./scripts/ci-packaging-cell.sh "${{ matrix.format }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.pkg.outcome == 'success'
        with:
          name: release-${{ matrix.format }}-${{ matrix.arch }}
          path: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg.tar.zst
            artifacts/*.snap
            artifacts/*.AppImage
            artifacts/*.AppImage.zsync
            artifacts/*.flatpak
            artifacts/*.tar.gz
            artifacts/PKGBUILD
            artifacts/install.sh
            artifacts/uninstall.sh
          if-no-files-found: error

  github-release:
    needs: [verify, build]
    # Publish whatever packaging cells succeeded (matrix fail-fast is false).
    if: |
      always()
      && needs.verify.result == 'success'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true
      - name: Add installer scripts
        run: |
          cp -n install.sh uninstall.sh release-artifacts/ 2>/dev/null || true
          ls -la release-artifacts/
      - name: SHA256SUMS
        run: |
          cd release-artifacts
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' | sort | xargs sha256sum -- > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: v${{ needs.verify.outputs.version }}
          tag_name: v${{ needs.verify.outputs.version }}
          body_path: docs/releases/v${{ needs.verify.outputs.version }}_github_description.md
          files: release-artifacts/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
