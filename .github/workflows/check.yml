name: Build & Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint in Docker
        env:
          GB_CI_STAGE: lint
        run: ./scripts/ci-docker.sh
      - name: Scenario registry gate
        if: ${{ !cancelled() }}
        run: python3 scripts/gen-scenarios-doc.py check

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Coverage in Docker
        env:
          GB_CI_STAGE: coverage
        run: ./scripts/ci-docker.sh
      - name: Local Sonar gates (complexity / duplication)
        run: python3 scripts/sonar-local.py
      - name: Require Cobertura report for Sonar
        run: test -f artifacts/coverage/coverage.xml
      - name: Reclaim the workspace
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"
      - name: Check SonarQube Cloud token
        id: sonar_token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo "SONAR_TOKEN not configured; skipping Sonar Cloud upload (local gates still ran)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./scripts/ci-sonar.sh --check-token
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: SonarQube Cloud scan
        if: |
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && steps.sonar_token.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 # v5.3.1
        with:
          args: >
            -Dsonar.sources=src/geekbench7_linux
            -Dsonar.python.coverage.reportPaths=artifacts/coverage/coverage.xml

  compat:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cell: [noble, jammy, debian13, fedora, arch]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit tests (${{ matrix.cell }})
        env:
          GB_CI_STAGE: compat
          GB_COMPAT_CELL: ${{ matrix.cell }}
        run: ./scripts/ci-docker.sh

  packaging:
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            runner: ubuntu-24.04
            platform: linux/amd64
          - format: rpm-fedora
            runner: ubuntu-24.04
            platform: linux/amd64
          - format: arch
            runner: ubuntu-24.04
            platform: linux/amd64
          - format: appimage
            runner: ubuntu-24.04
            platform: linux/amd64
          - format: tarball
            runner: ubuntu-24.04
            platform: linux/amd64
          - format: deb
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - format: tarball
            runner: ubuntu-24.04
            platform: linux/riscv64
            qemu: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: riscv64
      - name: Packaging cell ${{ matrix.format }} (${{ matrix.platform }})
        env:
          GB_DOCKER_PLATFORM: ${{ matrix.platform }}
        run: ./scripts/ci-packaging-cell.sh "${{ matrix.format }}"

  e2e-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Container E2E smoke (mocked / offline unit path)
        run: ./scripts/e2e-docker.sh smoke
