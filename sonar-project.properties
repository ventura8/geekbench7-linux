# SonarQube Cloud analysis for Geekbench 7 for Linux (unofficial).
#
# Scanned by scripts/ci-sonar.sh and by the coverage job in .github/workflows/check.yml.
# NOSONAR comments in code are forbidden (scripts/no-suppressions-lint.py).
#
# CI analysis only — disable SonarCloud Automatic Analysis for this project so
# docker/workflows/scripts are not scored as product code (Security E / 0% coverage).

sonar.organization=ventura8
sonar.projectKey=ventura8_geekbench7-linux
sonar.projectName=Geekbench 7 for Linux (unofficial)
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8
# Product code only. Coverage XML still maps onto these paths; tests are not scored.
sonar.sources=src/geekbench7_linux

sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14
sonar.python.coverage.reportPaths=artifacts/coverage/coverage.xml

# Keep CI/Docker/packaging/scripts/tests out of the quality gate even if Automatic
# Analysis or a broad scanner invocation tries to pull them in.
sonar.exclusions=\
  **/.github/**,\
  **/docker/**,\
  **/scripts/**,\
  **/packaging/**,\
  **/debian/**,\
  **/data/**,\
  **/bin/**,\
  **/docs/**,\
  **/tests/**,\
  **/build-*/**,\
  **/build/**,\
  **/artifacts/**,\
  **/.cache/**,\
  **/.venv/**,\
  **/logs/**

sonar.coverage.exclusions=\
  tests/**,\
  scripts/**,\
  bin/**
