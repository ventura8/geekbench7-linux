# SonarQube Cloud analysis for Geekbench 7 for Linux (unofficial).
#
# Scanned by the coverage job in .github/workflows/check.yml when SONAR_TOKEN is set.
# NOSONAR comments in code are forbidden (scripts/no-suppressions-lint.py).
#
# Prefer CI analysis: in SonarCloud → Administration → Analysis Method, disable
# Automatic Analysis so docker/workflows/scripts are not scored as product code.

sonar.organization=ventura8
sonar.projectKey=ventura8_geekbench7-linux
sonar.projectName=Geekbench 7 for Linux (unofficial)
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8
sonar.sources=src/geekbench7_linux
sonar.python.version=3.10,3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=artifacts/coverage/coverage.xml

# Single-line patterns (Automatic Analysis is picky about multiline continuations).
sonar.exclusions=**/.github/**,**/docker/**,**/scripts/**,**/packaging/**,**/debian/**,**/data/**,**/bin/**,**/docs/**,**/tests/**,**/build-*/**,**/build/**,**/artifacts/**,**/.cache/**,**/.venv/**,**/logs/**
sonar.coverage.exclusions=tests/**,scripts/**,bin/**
