name: geekbench7-linux
title: Geekbench 7 for Linux (unofficial)
base: core24
version: '1.0.0'
summary: Unofficial packaging for official Geekbench 7
description: |
  Downloads and launches official Geekbench 7 from Primate Labs' CDN.
  Not affiliated with Primate Labs. Buy Geekbench at https://www.geekbench.com/buy/.
grade: stable
confinement: classic
license: MIT
website: https://github.com/ventura8/geekbench7-linux
source-code: https://github.com/ventura8/geekbench7-linux
issues: https://github.com/ventura8/geekbench7-linux/issues
contact: alexandrescu.sergiu@gmail.com

apps:
  geekbench7-linux:
    command: usr/bin/geekbench7-linux
  geekbench7:
    command: usr/bin/geekbench7-linux

parts:
  geekbench7-linux:
    plugin: meson
    source: geekbench7-linux-src.tar.gz
    meson-parameters:
      - --prefix=/usr
      - -Dflavor=snap
      - -Dpython=/usr/bin/python3
      - -Dgeekbench_alias=true
    build-packages:
      - python3
      - meson
      - ninja-build
      - desktop-file-utils
      - appstream
    stage-packages:
      - python3
